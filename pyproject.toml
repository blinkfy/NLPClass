[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlplab"
version = "0.1.0"
description = "连续中文 NLP 课程实验平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
ner = ["hanlp>=2.1,<3"]
experiments = ["pandas>=2,<4", "scikit-learn>=1.4,<2"]
browser = ["playwright>=1.50,<2"]
sequence-neural = ["torch>=2.4,<2.15", "pytorch-crf==0.7.2"]
course-sequence = ["python-crfsuite==0.9.12"]

[project.scripts]
nlplab = "nlplab.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nlplab*", "app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.svg", "static/css/*.css", "static/js/*.js", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
