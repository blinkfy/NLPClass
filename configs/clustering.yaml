# 固定主 baseline；不使用真实类别选特征、配置或 K。
preprocessing:
  unicode_normalization: NFKC
  lowercase: true
  min_token_length: 2
  token_pattern: '[\u3400-\u9fff]+|[a-zA-Z][a-zA-Z0-9]*'
  stopwords: []
representation:
  min_df: 2
  max_df: 0.95
  max_features: 20000
  sublinear_tf: true
  smooth_idf: true
  norm: l2
kmeans:
  init: k-means++
  n_init: 10
  max_iter: 300
  tol: 0.0001
  random_state: 42
  algorithm: lloyd
k_values: [2, 3, 4, 5, 6, 7, 8, 9, 10]
stability_seeds: [42, 43, 44]
reference_k: 5
tokenizer_run_id: 20260926_130612_32a5e168_smooth
projection:
  method: TruncatedSVD
  n_components: 2
  n_iter: 7
  random_state: 42
  purpose: visualization_only
