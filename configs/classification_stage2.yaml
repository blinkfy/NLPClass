phase: exp3-stage2
stage1_run_id: 20261001_123337_9c1e7341
analyzer:
  unicode_normalization: NFKC
  lowercase: true
  content: Unicode Han ideographs, ASCII a-z, Unicode decimal digits (Nd)
  boundaries: all other codepoints; no crossing
  ngram_length: 2
  overlapping: true
  stopwords: []
  uses_tokenizer: false
count:
  min_df: 2
  max_df: 1.0
  max_features: null
tfidf:
  sublinear_tf: true
  smooth_idf: true
  use_idf: true
  norm: l2
candidates:
  k: [2000, 5000, 10000, all]
  C: [0.1, 0.5, 1.0, 2.0]
tie_break: [macro_f1_desc, accuracy_desc, selected_feature_count_asc, C_asc]
selector_tie_break: chi2_score_desc_then_term_asc
svm:
  multi_class: ovr
  penalty: l2
  loss: squared_hinge
  dual: true
  random_state: 42
  tol: 0.0001
  max_iter: 10000
final_fit_splits: [train, val]
test_policy: one_final_evaluation_after_selection_freeze
